<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img" aria-labelledby="title desc">
  <title id="title">Generate API Key dialog</title>
  <desc id="desc">Name the key ReviewLoop, choose the Customer Support role, then click Generate.</desc>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bg { fill: #f3f3f0; } .panel { fill: #ffffff; stroke: #d6d6d0; } .field { fill: #ffffff; stroke: #c9c9c3; }
    .text { fill: #1c1c21; } .muted { fill: #7c7c84; } .hl { fill: none; stroke: #4f46e5; stroke-width: 2.5; }
    .mark { fill: #4f46e5; } .marktext { fill: #ffffff; font-weight: 700; } .btn { fill: #4f46e5; } .btntext { fill: #ffffff; font-weight: 600; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #16161a; } .panel { fill: #202026; stroke: #35353d; } .field { fill: #18181d; stroke: #3d3d46; }
      .text { fill: #ececf0; } .muted { fill: #9a9aa3; } .hl { stroke: #8f89ff; } .mark, .btn { fill: #7c74ff; }
    }
  </style>
  <rect class="bg" width="640" height="260" rx="12"/>
  <rect class="panel" x="120" y="20" width="400" height="220" rx="12"/>
  <text class="text" x="144" y="56" font-size="16" font-weight="600">Generate API Key</text>

  <text class="muted" x="144" y="90" font-size="12">Name</text>
  <rect class="field" x="144" y="98" width="352" height="30" rx="6"/>
  <text class="text" x="156" y="118" font-size="13">ReviewLoop</text>

  <text class="muted" x="144" y="150" font-size="12">Access</text>
  <rect class="field" x="144" y="158" width="352" height="30" rx="6"/>
  <text class="text" x="156" y="178" font-size="13">Customer Support</text>
  <text class="muted" x="478" y="178" font-size="12">▾</text>
  <rect class="hl" x="140" y="154" width="360" height="38" rx="8"/>
  <circle class="mark" cx="104" cy="173" r="12"/>
  <text class="marktext" x="104" y="177.5" font-size="12" text-anchor="middle">1</text>

  <text class="muted" x="362" y="222" font-size="13">Cancel</text>
  <rect class="btn" x="424" y="203" width="80" height="30" rx="7"/>
  <text class="btntext" x="464" y="223" font-size="13" text-anchor="middle">Generate</text>
  <rect class="hl" x="420" y="199" width="88" height="38" rx="9"/>
  <circle class="mark" cx="540" cy="218" r="12"/>
  <text class="marktext" x="540" y="222.5" font-size="12" text-anchor="middle">2</text>
</svg>
