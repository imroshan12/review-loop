<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-labelledby="title desc">
  <title id="title">Invite the service account in Play Console</title>
  <desc id="desc">Paste the service account email, open App permissions, add your app with View app information and Reply to reviews, then click Invite user.</desc>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .bg { fill: #f3f3f0; } .panel { fill: #ffffff; stroke: #d6d6d0; } .field { fill: #ffffff; stroke: #c9c9c3; } .chip { fill: #e6f4ea; }
    .text { fill: #1c1c21; } .muted { fill: #7c7c84; } .chiptext { fill: #137333; } .accent { stroke: #4f46e5; }
    .box { fill: #2f6fdc; } .check { fill: none; stroke: #ffffff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .hl { fill: none; stroke: #4f46e5; stroke-width: 2.5; } .mark { fill: #4f46e5; } .marktext { fill: #ffffff; font-weight: 700; }
    .btn { fill: #2f6fdc; } .btntext { fill: #ffffff; font-weight: 600; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #16161a; } .panel { fill: #202026; stroke: #35353d; } .field { fill: #18181d; stroke: #3d3d46; } .chip { fill: #16301f; }
      .text { fill: #ececf0; } .muted { fill: #9a9aa3; } .chiptext { fill: #81c995; } .accent { stroke: #8f89ff; }
      .box, .btn { fill: #4d86e8; } .hl { stroke: #8f89ff; } .mark { fill: #7c74ff; }
    }
  </style>
  <rect class="bg" width="640" height="300" rx="12"/>

  <rect class="panel" x="16" y="16" width="608" height="40" rx="8"/>
  <text class="muted" x="32" y="41" font-size="12.5">Play Console  ›  Users and permissions  ›  </text>
  <text class="text" x="282" y="41" font-size="12.5" font-weight="600">Invite user</text>

  <rect class="panel" x="16" y="64" width="608" height="222" rx="8"/>
  <text class="muted" x="32" y="90" font-size="12">Email address</text>
  <rect class="field" x="32" y="98" width="380" height="30" rx="6"/>
  <text class="text mono" x="44" y="118" font-size="11.5">reviewloop@my-project.iam.gserviceaccount.com</text>
  <rect class="hl" x="28" y="94" width="388" height="38" rx="8"/>
  <circle class="mark" cx="436" cy="113" r="11"/>
  <text class="marktext" x="436" y="117.5" font-size="11.5" text-anchor="middle">1</text>

  <text class="muted" x="32" y="158" font-size="12.5">Account permissions</text>
  <text class="text" x="176" y="158" font-size="12.5" font-weight="600">App permissions</text>
  <line class="accent" x1="176" y1="165" x2="276" y2="165" stroke-width="2.5"/>
  <rect class="chip" x="296" y="145" width="84" height="20" rx="10"/>
  <text class="chiptext" x="338" y="159" font-size="11.5" font-weight="600" text-anchor="middle">FocusFlow</text>
  <circle class="mark" cx="400" cy="155" r="11"/>
  <text class="marktext" x="400" y="159.5" font-size="11.5" text-anchor="middle">2</text>

  <rect class="box" x="32" y="182" width="16" height="16" rx="3"/>
  <path class="check" d="M36 190.5l3 3 5.5-6"/>
  <text class="text" x="58" y="195" font-size="12.5">View app information and download bulk reports (read-only)</text>
  <rect class="box" x="32" y="210" width="16" height="16" rx="3"/>
  <path class="check" d="M36 218.5l3 3 5.5-6"/>
  <text class="text" x="58" y="223" font-size="12.5">Reply to reviews</text>
  <rect class="hl" x="26" y="176" width="440" height="56" rx="8"/>
  <circle class="mark" cx="486" cy="204" r="11"/>
  <text class="marktext" x="486" y="208.5" font-size="11.5" text-anchor="middle">3</text>

  <rect class="btn" x="496" y="244" width="112" height="30" rx="6"/>
  <text class="btntext" x="552" y="264" font-size="12.5" text-anchor="middle">Invite user</text>
  <rect class="hl" x="492" y="240" width="120" height="38" rx="8"/>
  <circle class="mark" cx="472" cy="259" r="11"/>
  <text class="marktext" x="472" y="263.5" font-size="11.5" text-anchor="middle">4</text>
</svg>
