<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 262" role="img" aria-labelledby="title desc">
  <title id="title">Create a JSON key for the service account</title>
  <desc id="desc">Open the service account, go to the Keys tab, choose Add key then Create new key, pick JSON and click Create.</desc>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bg { fill: #f3f3f0; } .panel { fill: #ffffff; stroke: #d6d6d0; } .menu { fill: #ffffff; stroke: #c9c9c3; } .sel { fill: #eef0ff; }
    .text { fill: #1c1c21; } .muted { fill: #7c7c84; } .accent { stroke: #4f46e5; } .radio { fill: none; stroke: #7c7c84; stroke-width: 1.5; } .dot { fill: #2f6fdc; }
    .hl { fill: none; stroke: #4f46e5; stroke-width: 2.5; } .mark { fill: #4f46e5; } .marktext { fill: #ffffff; font-weight: 700; }
    .btn { fill: #2f6fdc; } .btntext { fill: #ffffff; font-weight: 600; } .outline { fill: none; stroke: #b9b9b3; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #16161a; } .panel { fill: #202026; stroke: #35353d; } .menu { fill: #26262d; stroke: #3d3d46; } .sel { fill: #2a2850; }
      .text { fill: #ececf0; } .muted { fill: #9a9aa3; } .accent { stroke: #8f89ff; } .radio { stroke: #9a9aa3; } .dot { fill: #7fb0ff; }
      .hl { stroke: #8f89ff; } .mark { fill: #7c74ff; } .btn { fill: #4d86e8; } .outline { stroke: #4a4a54; }
    }
  </style>
  <rect class="bg" width="640" height="262" rx="12"/>

  <rect class="panel" x="16" y="16" width="608" height="40" rx="8"/>
  <text class="muted" x="32" y="41" font-size="12.5">IAM and admin  ›  Service accounts  ›  </text>
  <text class="text" x="262" y="41" font-size="12.5" font-weight="600">reviewloop</text>

  <rect class="panel" x="16" y="64" width="608" height="182" rx="8"/>
  <text class="muted" x="32" y="90" font-size="12.5">Details</text>
  <text class="muted" x="92" y="90" font-size="12.5">Permissions</text>
  <text class="text" x="180" y="90" font-size="12.5" font-weight="600">Keys</text>
  <line class="accent" x1="180" y1="97" x2="210" y2="97" stroke-width="2.5"/>
  <rect class="hl" x="174" y="74" width="42" height="28" rx="6"/>
  <circle class="mark" cx="236" cy="88" r="11"/>
  <text class="marktext" x="236" y="92.5" font-size="11.5" text-anchor="middle">1</text>

  <rect class="outline" x="32" y="114" width="92" height="28" rx="6"/>
  <text class="text" x="44" y="132" font-size="12.5" font-weight="600">Add key  ▾</text>
  <rect class="menu" x="32" y="148" width="176" height="66" rx="8"/>
  <rect class="sel" x="38" y="154" width="164" height="26" rx="5"/>
  <text class="text" x="48" y="171" font-size="12.5">Create new key</text>
  <text class="muted" x="48" y="201" font-size="12.5">Upload existing key</text>
  <rect class="hl" x="34" y="150" width="172" height="34" rx="7"/>
  <circle class="mark" cx="228" cy="167" r="11"/>
  <text class="marktext" x="228" y="171.5" font-size="11.5" text-anchor="middle">2</text>

  <rect class="menu" x="300" y="100" width="300" height="134" rx="10"/>
  <text class="text" x="320" y="128" font-size="14" font-weight="600">Create private key</text>
  <circle class="radio" cx="328" cy="156" r="7"/>
  <circle class="dot" cx="328" cy="156" r="3.5"/>
  <text class="text" x="344" y="160.5" font-size="12.5" font-weight="600">JSON</text>
  <circle class="radio" cx="328" cy="182" r="7"/>
  <text class="muted" x="344" y="186.5" font-size="12.5">P12</text>
  <text class="muted" x="444" y="220" font-size="12.5">Cancel</text>
  <rect class="btn" x="502" y="201" width="80" height="28" rx="6"/>
  <text class="btntext" x="542" y="220" font-size="12.5" text-anchor="middle">Create</text>
  <rect class="hl" x="314" y="142" width="84" height="28" rx="6"/>
  <rect class="hl" x="498" y="197" width="88" height="36" rx="8"/>
  <circle class="mark" cx="420" cy="156" r="11"/>
  <text class="marktext" x="420" y="160.5" font-size="11.5" text-anchor="middle">3</text>
</svg>
